name: Keep backend awake

# Render free adoarme dupa 15 min fara trafic; il pingam in orele de lucru (ora Romaniei ~07-20)
on:
  schedule:
    - cron: '*/10 4-17 * * 1-6'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 --retry 3 https://easyitp.onrender.com/api/health
