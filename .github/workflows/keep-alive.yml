name: Keep backend awake

# Render free adoarme dupa 15 min fara trafic. GitHub ruleaza cron-urile cu intarzieri mari,
# deci asta e doar o plasa de siguranta; pingul principal vine de la un monitor extern (UptimeRobot).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 --retry 3 https://easyitp.onrender.com/api/health
