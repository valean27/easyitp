spring.application.name=EasyITP
# URL-ul de conectare (am adaugat jdbc: in fata si am scos user/parola din link)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/itp}

# Datele de autentificare
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Driver-ul de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema e gestionata de Flyway (db/migration); Hibernate doar verifica la pornire ca entitatile se potrivesc.
# O coloana/tabel nou = un fisier nou Vn__descriere.sql (nu se modifica migrarile deja rulate).
spring.jpa.hibernate.ddl-auto=validate
# Bazele create inainte de Flyway (productia) sunt marcate ca fiind la V1 (schema de baza), apoi se ruleaza V2+
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}
# Jackson — serialize dates as ISO strings not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# Multipart file upload (CSV import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}

# JWT Configuration (JWT_SECRET obligatoriu, minim 32 de caractere; local: profilul dev)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# Admin implicit (ADMIN_PASSWORD obligatoriu in productie)
admin.email=${ADMIN_EMAIL:admin@itp.ro}
admin.password=${ADMIN_PASSWORD:}

# CORS, obligatoriu (ex: https://easyitp.vercel.app; mai multe separate prin virgula)
allowed.origins=${ALLOWED_ORIGINS:}

# Email zilnic (Resend). Fara RESEND_API_KEY emailurile sunt dezactivate.
resend.api-key=${RESEND_API_KEY:}
# Fara domeniu verificat in Resend, onboarding@resend.dev poate trimite doar catre emailul contului Resend
mail.from=${MAIL_FROM:EasyITP <onboarding@resend.dev>}
# Adresa aplicatiei, pentru link-urile din email
app.url=${APP_URL:https://easyitp.vercel.app}
# Secretul cu care GitHub Actions declanseaza trimiterea (POST /api/internal/daily-digest)
cron.secret=${CRON_SECRET:}

# Scanarea talonului cu Claude Haiku. Fara ANTHROPIC_API_KEY butonul de scanare raspunde ca nu e configurat.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

# Cererile de demonstratie din pagina de prezentare se anunta pe acest email (gol = doar in aplicatie, la admin)
leads.email=${LEADS_EMAIL:}

# SMS incluse in abonament: contul SMSLink al platformei (doar in variabilele de mediu, nu in cod)
platform.smslink.connection-id=${SMSLINK_CONNECTION_ID:}
platform.smslink.password=${SMSLINK_PASSWORD:}
# Nota de pe Google a statiilor (Google Places API New); fara cheie functia nu apare
google.places.api-key=${GOOGLE_PLACES_API_KEY:}
# Adresa publica a backend-ului, pentru notificarea de plata Netopia (IPN)
api.url=${API_URL:https://easyitp.onrender.com}
# Notificari push (Web Push): cheile VAPID P-256 in base64url (scripts/vapid-keys.sh); fara ele push-ul e oprit
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
push.vapid.subject=${VAPID_SUBJECT:mailto:contact@easyitp.ro}
# Plata abonamentelor prin NETOPIA Payments (API v2). Fara cheie, plata online nu apare (abonamentul il da adminul).
# Sandbox: https://secure.sandbox.netopia-payments.com ; productie: https://secure.mobilpay.ro/pay
netopia.url=${NETOPIA_URL:https://secure.sandbox.netopia-payments.com}
netopia.api-key=${NETOPIA_API_KEY:}
netopia.pos-signature=${NETOPIA_POS_SIGNATURE:}
# Facturile abonamentelor: contul Oblio al platformei (optional; fara el facturile se emit manual)
platform.oblio.email=${PLATFORM_OBLIO_EMAIL:}
platform.oblio.secret=${PLATFORM_OBLIO_SECRET:}
platform.oblio.cif=${PLATFORM_OBLIO_CIF:}
platform.oblio.series=${PLATFORM_OBLIO_SERIES:}
