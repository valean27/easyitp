# Profil de test: H2 in memorie in modul PostgreSQL, schema recreata la fiecare context
spring.datasource.url=jdbc:h2:mem:easyitp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# Pe H2 schema vine din entitati; migrarile (sintaxa Postgres) se verifica pe Postgres
spring.flyway.enabled=false
jwt.secret=test-secret-key-that-is-long-enough-for-hs256-signing
admin.password=admin-test-pass
cron.secret=test-cron-secret
allowed.origins=http://localhost:5173
# Ceasul de dimineata (DailyJobScheduler) e oprit in teste; rularea se porneste din teste
daily.scheduler.enabled=false
